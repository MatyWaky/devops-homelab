---

- name: Validate supported Red Hat-family distribution
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts['distribution_major_version']
        in docker_rpm_supported_versions.get(
          ansible_facts['distribution'], []
        )
    fail_msg: >-
      Unsupported distribution or version:
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }}

- name: Install DNF plugins on Rocky/RedHat/AlmaLinux
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  when: ansible_facts['distribution'] in ['Rocky','RedHat', 'AlmaLinux']

- name: Configure Docker repo on Rocky/RedHat/AlmaLinux
  ansible.builtin.command:
    argv:
      - dnf
      - config-manager
      - --add-repo
      - https://download.docker.com/linux/rhel/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo
  when: ansible_facts['distribution'] in ['Rocky','RedHat','AlmaLinux']
  register: docker_repository_rhel_family

- name: Configure Docker repo on Fedora
  ansible.builtin.command:
    argv:
      - dnf
      - config-manager
      - addrepo
      - --from-repofile
      - https://download.docker.com/linux/fedora/docker-ce.repo
    creates: /etc/yum.repos.d/docker-ce.repo
  when: ansible_facts['distribution'] == 'Fedora'
  register: docker_repository_fedora

- name: Install Docker packages
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: present
    update_cache: >-
      {{
        docker_repository_rhel_family.changed | default(false)
        or
        docker_repository_fedora.changed | default(false)
      }}

- name: Enable and start Docker service
  ansible.builtin.service:
    name: "{{ docker_service }}"
    state: started
    enabled: true

