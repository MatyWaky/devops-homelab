---

- name: Install Docker on Debian family systems
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == "Debian"

- name: Install Docker on Red Hat family systems
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Fail when OS family is unsupported
  ansible.builtin.fail:
    msg: "Docker role does not support OS family: {{ ansible_facts['os_family'] }}"
  when: ansible_facts['os_family'] not in ["Debian", "RedHat"]
